<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Навчи машину малюнкам</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: drawing canvas on the left, three class "boxes" with examples on the right, machine's guess under the canvas */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#E9EDF3;
  --ink:#151A22; --ink-2:#3C4656; --muted:#687386;
  --line:#D8DFE8; --line-strong:#BEC8D6;
  --accent:#2E4A7D; --on-accent:#FFFFFF; --accent-soft:#E2E9F5;
  --c0:#2E4A7D; --c1:#146B66; --c2:#8A570F;
  --good:#1E6B3A; --good-soft:#E1F1E6; --bad:#8C2F2F; --bad-soft:#F6E3E3;
  --paper:#FFFFFF; --pen:#151A22;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#10131A; --surface:#181C25; --surface-2:#222836;
    --ink:#E9EDF4; --ink-2:#C2CAD8; --muted:#8C96A9;
    --line:#2A3140; --line-strong:#3A4354;
    --accent:#93B4E8; --on-accent:#10131A; --accent-soft:#1C2637;
    --c0:#93B4E8; --c1:#6ACFC5; --c2:#DCA76A;
    --good:#7FD39A; --good-soft:#18291F; --bad:#E89494; --bad-soft:#2E1C1C;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Archivo",Arial,sans-serif;font-size:17px;line-height:1.45}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px 60px}
header{padding:24px 0 12px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px}
.kicker{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{font-weight:800;font-size:clamp(28px,4.6vw,42px);line-height:1.05;margin:4px 0 0;letter-spacing:-.02em}
.score{font-family:"IBM Plex Mono",monospace;font-size:15px;color:var(--ink-2);text-align:right}
.score b{font-family:"Archivo",Arial,sans-serif;font-size:26px;color:var(--ink)}
.grid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
canvas{display:block;width:100%;max-width:300px;aspect-ratio:1/1;background:var(--paper);border:2px solid var(--line-strong);border-radius:8px;touch-action:none;cursor:crosshair;margin:0 auto}
.btn{appearance:none;font-family:"Archivo",Arial,sans-serif;font-weight:700;font-size:16px;padding:11px 16px;border-radius:8px;border:2px solid var(--accent);background:var(--accent);color:var(--on-accent);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line-strong)}
.btn:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.guess{margin-top:14px;text-align:center}
.guess .big{font-size:28px;font-weight:800;min-height:38px}
.guess .small{font-size:14px;color:var(--muted)}
.cbar{display:grid;grid-template-columns:90px 1fr 46px;gap:8px;align-items:center;margin-top:6px;font-size:14px}
.cbar .t{height:14px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.cbar .f{height:100%}
.cbar .p{font-family:"IBM Plex Mono",monospace;text-align:right;color:var(--ink-2)}
.cbar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.check{display:flex;gap:8px;justify-content:center;margin-top:10px}
.check .btn{font-size:15px;padding:8px 14px}
.ok{background:var(--good);border-color:var(--good);color:var(--on-accent)}
.no{background:var(--bad);border-color:var(--bad);color:var(--on-accent)}
.classes{display:grid;gap:12px}
.cls{border:2px solid var(--line);border-radius:10px;padding:12px;background:var(--surface)}
.cls-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cls-head input{font:inherit;font-weight:700;font-size:18px;padding:6px 10px;border:1px solid var(--line-strong);border-radius:6px;background:var(--bg);color:var(--ink);width:160px}
.cls-head .cnt{font-family:"IBM Plex Mono",monospace;font-size:14px;color:var(--muted);margin-left:auto}
.cls .add{border-width:2px}
.thumbs{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px;min-height:44px}
.thumbs canvas{width:40px;height:40px;max-width:none;border-width:1px;border-radius:4px;cursor:default}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block}
.tip{font-size:14.5px;color:var(--muted);margin:8px 0 0}
.bottom{margin-top:18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* mission card: opened by a code the teacher says aloud, so nobody needs the teacher's screen */
.mission{background:var(--surface);border:2px solid var(--line-strong);border-radius:10px;padding:10px 14px;margin-bottom:12px}
.mission.up{border-color:var(--bad);background:var(--bad-soft)}
.m-code{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-weight:600}
.m-code input{font-family:"IBM Plex Mono",monospace;font-size:20px;font-weight:600;width:72px;padding:6px 8px;border:2px solid var(--line-strong);border-radius:6px;background:var(--bg);color:var(--ink);text-align:center}
.m-code .btn{padding:7px 14px;font-size:15px}
.m-err{color:var(--bad);font-size:14.5px}
.m-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.m-no{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.m-time{font-family:"IBM Plex Mono",monospace;font-size:30px;font-weight:600;color:var(--ink)}
.mission.up .m-time{color:var(--bad)}
.m-title{font-size:21px;font-weight:800;margin:2px 0 6px}
.m-list{margin:0 0 8px;padding-left:22px}
.m-list li{margin:3px 0}
.m-up{font-weight:700;color:var(--bad);margin:6px 0}
.m-end{font-weight:700;margin:6px 0}
.m-sec{background:var(--accent-soft);border-left:4px solid var(--accent);border-radius:6px;padding:8px 12px;margin:8px 0}
.m-foot{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-top:8px}
.m-foot .m-code{font-weight:500;font-size:15px;color:var(--ink-2)}
.m-foot .m-code input{font-size:16px;width:60px;padding:4px 6px}
.hright{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.lang{display:inline-flex;border:2px solid var(--line-strong);border-radius:8px;overflow:hidden}
.lang button{appearance:none;font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:14px;padding:6px 12px;border:0;background:transparent;color:var(--ink-2);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.lang button:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="kicker" data-i18n="kicker">Інформатика · штучний інтелект</div>
      <h1 data-i18n="title">Навчи машину малюнкам</h1>
    </div>
    <div class="hright">
      <div class="lang" role="group" aria-label="Мова / Language">
        <button type="button" data-lang="uk" aria-pressed="true">UA</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <div class="score"><span data-i18n="scoreA">вгадала</span><br><b id="okc">0</b> <span data-i18n="of">з</span> <b id="allc">0</b></div>
    </div>
  </header>

  <div class="grid">
    <div class="card">
      <canvas id="pad" width="280" height="280" data-i18n-aria="pad" aria-label="Поле для малювання"></canvas>
      <div class="row">
        <button class="btn ghost" type="button" id="clear" data-i18n="clear">Стерти</button>
        <button class="btn" type="button" id="ask" data-i18n="ask">Що це?</button>
      </div>
      <div class="guess" aria-live="polite">
        <div class="big" id="gBig"></div>
        <div class="small" id="gSmall">Намалюй щось і натисни «Що це?»</div>
        <div id="gBars"></div>
        <div class="check" id="checkRow" hidden>
          <button class="btn ok" type="button" id="yes" data-i18n="yes">Так, вгадала</button>
          <button class="btn no" type="button" id="nope" data-i18n="nope">Ні, помилилась</button>
        </div>
      </div>
    </div>

    <div>
      <section class="mission" id="mission" aria-live="polite"></section>
      <div class="classes" id="classes"></div>
      <p class="tip" data-i18n="tip">Намалюй у полі приклад і натисни «Це — …» біля потрібної групи. Машина запам'ятає малюнок. Що більше різних прикладів, то краще вона вгадує.</p>
      <div class="bottom">
        <button class="btn ghost" type="button" id="wipe" data-i18n="wipe">Забути все</button>
        <button class="btn ghost" type="button" id="names" data-i18n="names">Повернути назви</button>
        <button class="btn ghost" type="button" id="fresh" data-i18n="fresh">Новий урок: усе з нуля</button>
        <span class="confirm" id="wipeAsk" hidden><span id="wipeText">Машина забуде всі приклади. Точно?</span>
          <button class="btn no" type="button" id="wipeYes" data-i18n="y">Так</button>
          <button class="btn ghost" type="button" id="wipeNo" data-i18n="n">Ні</button>
        </span>
      </div>
    </div>
  </div>
</div>

      uk:{t:'Свої малюнки',x:['Натисни «Забути все» і перейменуй групи: наприклад, сонце, будинок, риба або веселий, сумний і здивований смайлик.','Навчи машину своїм малюнкам — мінімум по 4 приклади.','Пересядь за сусідній комп\'ютер і малюй для чужої машини. Лічильник угорі — оцінка тому, хто її вчив.'],s:'Двійники: дві дуже схожі групи — коло й овал, яблуко й помідор. Скільки прикладів треба, щоб машина їх не плутала?'},
      en:{t:'Your own drawings',x:['Press “Forget everything” and rename the groups: for example sun, house, fish — or a happy, a sad and a surprised smiley.','Teach the machine your drawings — at least 4 examples each.','Move to your neighbour’s computer and draw for their machine. The counter at the top is the score of whoever taught it.'],s:'Twins: two very similar groups — circle and oval, apple and tomato. How many examples does the machine need to stop mixing them up?'}}
  };
  var SETSIZE={'3':5,'4':4}, MKEY='malyunky-mission', TTL=3*3600*1000;
  var lang='uk';
  try{ var sl=localStorage.getItem(LANGKEY); if(sl&&T[sl]) lang=sl; }catch(e){}
  try{ var qp=new URLSearchParams(location.search).get('lang'); if(qp&&T[qp]) lang=qp; }catch(e){}
  function t(k,n){ var s=T[lang][k]; if(n!=null) s=s.replace('{n}',n); return s; }
  var DEFAULT_NAMES=DEFAULTS[lang];
  var state={names:DEFAULT_NAMES.slice(), ex:[[],[],[]], ok:0, all:0};
  try{ var raw=localStorage.getItem(KEY); if(raw){ var o=JSON.parse(raw); if(o&&o.ex&&o.names) state=o; } }catch(e){}
  function save(){ try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){} }
  var $=function(id){return document.getElementById(id);};
  var msgKey='hint', bigKey=null, lastR=null;
  function say(k){ msgKey=k; $('gSmall').textContent=t(k); }
  var pad=$('pad'), ctx=pad.getContext('2d');
  function css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
  function clearPad(){ ctx.fillStyle='#FFFFFF'; ctx.fillRect(0,0,pad.width,pad.height); drew=false; }
  var drawing=false, last=null, drew=false;
  function pos(e){ var r=pad.getBoundingClientRect(); return {x:(e.clientX-r.left)*pad.width/r.width, y:(e.clientY-r.top)*pad.height/r.height}; }
  pad.addEventListener('pointerdown',function(e){ drawing=true; last=pos(e); pad.setPointerCapture(e.pointerId); dot(last); });
  pad.addEventListener('pointermove',function(e){ if(!drawing) return; var p=pos(e); line(last,p); last=p; });
  pad.addEventListener('pointerup',function(){ drawing=false; });
  pad.addEventListener('pointercancel',function(){ drawing=false; });
  function line(a,b){ ctx.strokeStyle='#151A22'; ctx.lineWidth=12; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); drew=true; }
  function dot(p){ line(p,{x:p.x+0.1,y:p.y+0.1}); }

  /* the picture becomes a 16×16 grid of numbers: how much ink is in each cell.
     First the drawing is cut out and stretched to fill the grid, so size and position don't matter, only shape. */
  var off=document.createElement('canvas'); off.width=64; off.height=64; var octx=off.getContext('2d');
  function features(){
    var W=pad.width,H=pad.height, img=ctx.getImageData(0,0,W,H).data;
    var x0=W,y0=H,x1=-1,y1=-1;
    for(var y=0;y<H;y+=2){ for(var x=0;x<W;x+=2){ var i=(y*W+x)*4; if(img[i]+img[i+1]+img[i+2]<500){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; } } }
    var f=new Array(N*N).fill(0);
    if(x1<0) return f;
    var bw=x1-x0+1, bh=y1-y0+1, side=Math.max(bw,bh)+12;
    var sx=x0+bw/2-side/2, sy=y0+bh/2-side/2;
    octx.fillStyle='#FFFFFF'; octx.fillRect(0,0,64,64);
    octx.drawImage(pad,sx,sy,side,side,4,4,56,56);
    var d=octx.getImageData(0,0,64,64).data;
    for(var cy=0;cy<N;cy++) for(var cx=0;cx<N;cx++){
      var sum=0; for(var yy=0;yy<4;yy++) for(var xx=0;xx<4;xx++){ var k=((cy*4+yy)*64+(cx*4+xx))*4; sum+=1-(d[k]+d[k+1]+d[k+2])/765; }
      f[cy*N+cx]=Math.min(1,sum/16*2);
    }
    /* soften: each cell shares ink with its neighbours, so a line drawn a little to the side still matches */
    for(var pass=0;pass<2;pass++){
      var g=new Array(N*N).fill(0);
      for(var y2=0;y2<N;y2++) for(var x2=0;x2<N;x2++){ var s2=0,n2=0; for(var dy=-1;dy<=1;dy++) for(var dx=-1;dx<=1;dx++){ var X=x2+dx,Y=y2+dy; if(X>=0&&Y>=0&&X<N&&Y<N){ s2+=f[Y*N+X]; n2++; } } g[y2*N+x2]=s2/n2; }
      f=g;
    }
    return f;
  }
  function dist(a,b){ var s=0; for(var i=0;i<a.length;i++){ var d=a[i]-b[i]; s+=d*d; } return Math.sqrt(s); }
  function predict(f){
    var all=[]; state.ex.forEach(function(list,c){ list.forEach(function(v){ all.push({c:c,d:dist(f,v)}); }); });
    if(!all.length) return null;
    all.sort(function(a,b){return a.d-b.d;});
    var k=Math.min(K,all.length), score=[0,0,0];
    for(var i=0;i<k;i++){ score[all[i].c]+=1/(all[i].d+0.5); }
    var tot=score.reduce(function(a,b){return a+b;},0);
    var p=score.map(function(s){return s/tot;});
    var best=p.indexOf(Math.max.apply(null,p));
    return {best:best,p:p};
  }
  function thumb(v){ var c=document.createElement('canvas'); c.width=N; c.height=N; var g=c.getContext('2d'); var im=g.createImageData(N,N); for(var i=0;i<N*N;i++){ var val=255-Math.round(v[i]*255); im.data[i*4]=val; im.data[i*4+1]=val; im.data[i*4+2]=val; im.data[i*4+3]=255; } g.putImageData(im,0,0); c.style.imageRendering='pixelated'; return c; }
  function renderClasses(){
    var box=$('classes'); box.innerHTML='';
    state.names.forEach(function(nm,c){
      var d=document.createElement('div'); d.className='cls'; d.style.borderColor='var('+COLORS[c]+')';
      var h=document.createElement('div'); h.className='cls-head';
      var dotEl=document.createElement('span'); dotEl.className='dot'; dotEl.style.background='var('+COLORS[c]+')';
      var inp=document.createElement('input'); inp.type='text'; inp.value=nm; inp.id='name'+c; inp.setAttribute('aria-label',t('groupName',c+1));
      inp.addEventListener('input',function(){ state.names[c]=inp.value||t('group',c+1); save(); addBtn.textContent=t('thisIs')+state.names[c]; });
      var addBtn=document.createElement('button'); addBtn.type='button'; addBtn.className='btn add'; addBtn.style.background='var('+COLORS[c]+')'; addBtn.style.borderColor='var('+COLORS[c]+')'; addBtn.textContent=t('thisIs')+nm;
      addBtn.addEventListener('click',function(){ if(!drew){ say('drawFirst'); return; } state.ex[c].push(features()); save(); clearPad(); renderClasses(); say('saved'); resetGuess(); $('checkRow').hidden=true; });
      var cnt=document.createElement('span'); cnt.className='cnt'; cnt.textContent=t('count')+state.ex[c].length;
      var undo=document.createElement('button'); undo.type='button'; undo.className='btn ghost'; undo.textContent='−'; undo.title=t('undo'); undo.setAttribute('aria-label',t('undoAria',c+1)); undo.style.padding='8px 12px';
      undo.addEventListener('click',function(){ state.ex[c].pop(); save(); renderClasses(); });
      h.appendChild(dotEl); h.appendChild(inp); h.appendChild(addBtn); h.appendChild(undo); h.appendChild(cnt);
      var th=document.createElement('div'); th.className='thumbs';
      state.ex[c].slice(-24).forEach(function(v){ th.appendChild(thumb(v)); });
      d.appendChild(h); d.appendChild(th); box.appendChild(d);
    });
    $('okc').textContent=state.ok; $('allc').textContent=state.all;
  }
  function resetGuess(){ lastR=null; bigKey=null; $('gBig').textContent=''; $('gBars').innerHTML=''; $('checkRow').hidden=true; }
  $('clear').addEventListener('click',function(){ clearPad(); resetGuess(); say('hint'); });
  $('ask').addEventListener('click',function(){
    if(!drew){ say('blank'); return; }
    var r=predict(features());
    resetGuess();
    if(!r){ bigKey='dunno'; $('gBig').style.color=''; $('gBig').textContent=t('dunno'); say('noEx'); return; }
    lastR=r; showGuess(); say('conf');
    $('checkRow').hidden=false;
  });
  function showGuess(){
    var r=lastR; if(!r) return;
    $('gBars').innerHTML='';
    $('gBig').textContent=state.names[r.best]+'?';
    $('gBig').style.color='var('+COLORS[r.best]+')';
    state.names.forEach(function(nm,c){
      var b=document.createElement('div'); b.className='cbar';
      b.innerHTML='<span class="nm"></span><span class="t"><span class="f" style="display:block;width:'+Math.round(r.p[c]*100)+'%;background:var('+COLORS[c]+')"></span></span><span class="p">'+Math.round(r.p[c]*100)+'%</span>';
      b.querySelector('.nm').textContent=nm; $('gBars').appendChild(b);
    });
  }
  function mark(ok){ state.all++; if(ok) state.ok++; save(); renderClasses(); resetGuess(); clearPad(); say(ok?'markOk':'markNo'); }
  $('yes').addEventListener('click',function(){ mark(true); });
  $('nope').addEventListener('click',function(){ mark(false); });
  var wipeMode='ex';
  function wipeText(){ $('wipeText').textContent = wipeMode==='all' ? T[lang].wipeAll.replace('{names}',DEFAULT_NAMES.join(', ')) : t('wipeEx'); }
  $('wipe').addEventListener('click',function(){ wipeMode='ex'; wipeText(); $('wipeAsk').hidden=false; });
  $('fresh').addEventListener('click',function(){ wipeMode='all'; wipeText(); $('wipeAsk').hidden=false; });
  $('wipeNo').addEventListener('click',function(){ $('wipeAsk').hidden=true; });
  $('wipeYes').addEventListener('click',function(){ state.ex=[[],[],[]]; state.ok=0; state.all=0; if(wipeMode==='all'){ state.names=DEFAULT_NAMES.slice(); mis=null; saveMis(); renderMission(); } save(); renderClasses(); clearPad(); resetGuess(); say('hint'); $('wipeAsk').hidden=true; });
  $('names').addEventListener('click',function(){ state.names=DEFAULT_NAMES.slice(); save(); renderClasses(); });
  var mis=null, tick=null;
  try{ var mr=JSON.parse(localStorage.getItem(MKEY)||'null'); if(mr&&MIS[mr.code]&&Date.now()-mr.start<TTL) mis=mr; }catch(e){}
  function saveMis(){ try{ if(mis) localStorage.setItem(MKEY,JSON.stringify(mis)); else localStorage.removeItem(MKEY); }catch(e){} }
  function codeForm(labelKey,id){
    return '<div class="m-code"><label for="'+id+'">'+t(labelKey)+'</label><input id="'+id+'" type="text" inputmode="numeric" maxlength="2" autocomplete="off"><button class="btn" type="button" data-go="'+id+'">OK</button><span class="m-err" id="'+id+'Err"></span></div>';
  }
  function esc(x){ var d=document.createElement('div'); d.textContent=x; return d.innerHTML; }
  function left(){ var m=MIS[mis.code]; return m.min ? m.min*60000-(Date.now()-mis.start) : null; }
  function fmt(ms){ var s=Math.max(0,Math.ceil(ms/1000)); return Math.floor(s/60)+':'+('0'+s%60).slice(-2); }
  function renderMission(){
    var box=$('mission'); clearInterval(tick);
    if(!mis){ box.className='mission'; box.innerHTML=codeForm('mCode','mc'); wireCode('mc'); return; }
    var m=MIS[mis.code], L=m[lang], h='';
    h+='<div class="m-head"><span class="m-no">'+t('mOf').replace('{n}',m.n).replace('{m}',SETSIZE[m.set])+'</span>'+(m.min?'<span class="m-time" id="mTime"></span>':'')+'</div>';
    h+='<div class="m-title">'+esc(L.t)+'</div><ul class="m-list">'+L.x.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>';
    if(m.min) h+='<div class="m-up" id="mUp" hidden>'+esc(t('mUp'))+(L.end?' '+esc(L.end):'')+'</div>';
    else if(L.end) h+='<div class="m-end">'+esc(L.end)+'</div>';
    if(L.s) h+= mis.sec ? '<div class="m-sec"><b>'+t('mSec')+'.</b> '+esc(L.s)+'</div>' : '';
    h+='<div class="m-foot">'+(L.s&&!mis.sec?'<button class="btn ghost" type="button" id="mDone">'+t('mDone')+'</button>':'<span></span>')+codeForm('mNext','mn')+'</div>';
    box.innerHTML=h; wireCode('mn');
    if($('mDone')) $('mDone').addEventListener('click',function(){ mis.sec=true; saveMis(); renderMission(); });
    if(m.min){
      var upd=function(){ var l=left(); $('mTime').textContent=fmt(l); var up=l<=0; box.className='mission'+(up?' up':''); $('mUp').hidden=!up; if(up) clearInterval(tick); };
      upd(); tick=setInterval(upd,1000);
    } else box.className='mission';
  }
  function wireCode(id){
    var inp=$(id), go=function(){
      var c=inp.value.replace(/\D/g,'');
      if(!MIS[c]){ $(id+'Err').textContent=t('mBad'); inp.select(); return; }
      if(mis&&mis.code===c){ inp.value=''; return; }
      mis={code:c,start:Date.now(),sec:false}; saveMis(); renderMission();
    };
    inp.addEventListener('keydown',function(e){ if(e.key==='Enter') go(); });
    inp.addEventListener('input',function(){ $(id+'Err').textContent=''; });
    document.querySelector('[data-go="'+id+'"]').addEventListener('click',go);
  }
  /* language: static texts via data-i18n; group names that are still the other language's defaults get translated, custom names stay */
  function applyLang(){
    document.documentElement.lang=lang;
    document.title=t('doc');
    document.querySelectorAll('[data-i18n]').forEach(function(el){ el.textContent=t(el.getAttribute('data-i18n')); });
    document.querySelectorAll('[data-i18n-aria]').forEach(function(el){ el.setAttribute('aria-label',t(el.getAttribute('data-i18n-aria'))); });
    document.querySelectorAll('.lang button').forEach(function(b){ b.setAttribute('aria-pressed', b.getAttribute('data-lang')===lang?'true':'false'); });
    $('gSmall').textContent=t(msgKey);
    if(bigKey) $('gBig').textContent=t(bigKey);
    showGuess(); wipeText(); renderClasses(); renderMission();
  }
  function setLang(nl){
    if(nl===lang||!T[nl]) return;
    var oldD=DEFAULTS[lang], newD=DEFAULTS[nl];
    state.names=state.names.map(function(nm,i){ return nm===oldD[i] ? newD[i] : nm; });
    lang=nl; DEFAULT_NAMES=newD; save();
    try{ localStorage.setItem(LANGKEY,lang); }catch(e){}
    applyLang();
  }
  document.querySelectorAll('.lang button').forEach(function(b){ b.addEventListener('click',function(){ setLang(b.getAttribute('data-lang')); }); });
  /* saved names may be defaults of the other language (e.g. opened with ?lang=en) */
  var otherD=DEFAULTS[lang==='uk'?'en':'uk'];
  state.names=state.names.map(function(nm,i){ return nm===otherD[i] ? DEFAULT_NAMES[i] : nm; });
  clearPad(); applyLang();
})();
</script>
