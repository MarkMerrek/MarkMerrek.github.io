*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Archivo",Arial,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:40px 18px}
h1{font-size:40px;font-weight:800;margin:0 0 24px}

a:hover,a:focus-visible{border-color:var(--accent);outline:none}
a b{display:block;font-size:24px;font-weight:700}
a span{color:var(--muted);font-size:16px}
</style>
