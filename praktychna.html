<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Практична: навчи й перевір ШІ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Practical work: students pick training examples (fruit or vegetable), the machine learns ONE rule (the OneR algorithm),
   then it is tested on 12 products it has never seen. Tasks are checked automatically and scored out of 12. Works offline. */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#E9EDF3;
  --ink:#151A22; --ink-2:#3C4656; --muted:#687386;
  --line:#D8DFE8; --line-strong:#BEC8D6;
  --accent:#2E4A7D; --on-accent:#FFFFFF; --accent-soft:#E2E9F5;
  --fruit:#B0284A; --fruit-soft:#F8E1E7; --veg:#1E6B3A; --veg-soft:#E1F1E6; --berry:#6A3FA0; --berry-soft:#ECE4F6;
  --ok:#1E6B3A; --bad:#8C2F2F; --bad-soft:#F6E3E3; --warm:#8A570F; --warm-soft:#F5E9D7;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#10131A; --surface:#181C25; --surface-2:#222836;
    --ink:#E9EDF4; --ink-2:#C2CAD8; --muted:#8C96A9;
    --line:#2A3140; --line-strong:#3A4354;
    --accent:#93B4E8; --on-accent:#10131A; --accent-soft:#1C2637;
    --fruit:#F08AA3; --fruit-soft:#3A1C25; --veg:#7FD39A; --veg-soft:#18291F; --berry:#C3A6F0; --berry-soft:#2A2138;
    --ok:#7FD39A; --bad:#E89494; --bad-soft:#2E1C1C; --warm:#DCA76A; --warm-soft:#2C2318;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Archivo",Arial,sans-serif;font-size:16.5px;line-height:1.45}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px 60px}
header{padding:22px 0 10px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px}
.kicker{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{font-weight:800;font-size:clamp(26px,4vw,38px);line-height:1.05;margin:4px 0 0;letter-spacing:-.02em}
h2{font-size:19px;margin:0 0 8px}
h3{font-size:16px;margin:0 0 6px}
.hright{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.lang{display:inline-flex;border:2px solid var(--line-strong);border-radius:8px;overflow:hidden}
.lang button{appearance:none;font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:14px;padding:6px 12px;border:0;background:transparent;color:var(--ink-2);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.who{font-family:"IBM Plex Mono",monospace;font-size:14px;color:var(--ink-2);text-align:right}
.who b{font-family:"Archivo",Arial,sans-serif;font-size:22px;color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.btn{appearance:none;font-family:"Archivo",Arial,sans-serif;font-weight:700;font-size:16px;padding:10px 16px;border-radius:8px;border:2px solid var(--accent);background:var(--accent);color:var(--on-accent);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line-strong)}
.btn.sm{font-size:14.5px;padding:7px 12px}
.btn.no{background:var(--bad);border-color:var(--bad);color:var(--on-accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,input:focus-visible,.item:focus-visible,.tab:focus-visible,.lab:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input[type=text]{font:inherit;font-size:17px;padding:8px 10px;border:1px solid var(--line-strong);border-radius:6px;background:var(--bg);color:var(--ink)}
.note{font-size:14.5px;color:var(--muted)}
/* start */
.start{max-width:560px;margin:40px auto;display:grid;gap:14px}
.start label{font-weight:600;display:grid;gap:6px}
.err{color:var(--bad);font-size:14.5px;min-height:20px}
/* tasks */
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.tab{appearance:none;border:2px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer;font:inherit;font-weight:700;font-size:15px;display:flex;gap:6px;align-items:center}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
.tab .pt{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--muted);font-weight:500}
.tab.full .pt{color:var(--ok);font-weight:700}
.tabsep{align-self:center;font-family:"IBM Plex Mono",monospace;font-size:12.5px;font-weight:600;color:var(--muted);padding:0 4px 0 10px;border-left:2px solid var(--line-strong);margin-left:4px}
.tab.bonus{border-style:dashed}
.who small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.who small span{font-weight:600;color:var(--ink-2);letter-spacing:.04em}
.rcode{font-family:"IBM Plex Mono",monospace;font-size:22px;font-weight:600;letter-spacing:.06em}
.task{border-left:4px solid var(--accent)}
.task ol,.task ul{margin:6px 0 10px;padding-left:22px}
.task li{margin:3px 0}
.q{margin:10px 0;padding:10px 12px;background:var(--surface-2);border-radius:8px}
.q p{margin:0 0 6px;font-weight:600}
.q label{display:flex;gap:8px;align-items:flex-start;margin:4px 0;cursor:pointer}
.q .opts{display:flex;flex-wrap:wrap;gap:4px 18px}
.scheme{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px;font-weight:700}
.seg{display:inline-flex;border:2px solid var(--line-strong);border-radius:8px;overflow:hidden}
.seg button{appearance:none;font:inherit;font-weight:700;font-size:16px;padding:8px 16px;border:0;background:var(--surface);color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--berry);color:#fff}
.q input[type=text]{width:90px;text-align:center;font-family:"IBM Plex Mono",monospace}
.feedback{margin-top:8px;font-weight:700;min-height:22px}
.feedback.ok{color:var(--ok)} .feedback.part{color:var(--warm)}
.feedback ul{font-weight:500;color:var(--ink-2);margin:4px 0 0}
.grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start;margin-top:14px}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
.pool{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.item{appearance:none;text-align:left;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 8px;cursor:pointer;font:inherit;display:grid;grid-template-columns:auto 1fr;gap:0 8px;align-items:center}
.item .em{font-size:30px;grid-row:span 2;line-height:1}
.item .nm{font-weight:700;font-size:15px}
.item .ft{font-size:12px;color:var(--muted);line-height:1.25}
.item.in{border-color:var(--accent);background:var(--accent-soft)}
.item.fr .nm{color:var(--fruit)} .item.vg .nm{color:var(--veg)} .item.br .nm{color:var(--berry)}
.item .nm small{font-weight:600;font-size:12px}
.train{display:flex;flex-wrap:wrap;gap:6px;min-height:40px}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line-strong);border-radius:999px;padding:3px 4px 3px 9px;background:var(--surface);font-size:15px}
.chip .x{appearance:none;border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px;padding:0 4px}
.lab{appearance:none;border:0;border-radius:999px;padding:2px 9px;font:inherit;font-size:13px;font-weight:700;cursor:default}
.lab.fr{background:var(--fruit-soft);color:var(--fruit)} .lab.vg{background:var(--veg-soft);color:var(--veg)} .lab.br{background:var(--berry-soft);color:var(--berry)}
.lab.flip{cursor:pointer;outline:2px dashed var(--warm);outline-offset:1px}
.rule{background:var(--warm-soft);border-radius:8px;padding:10px 12px;margin:10px 0}
.rule b{color:var(--warm)}
.rule ul{margin:4px 0 0;padding-left:20px}
.tests{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:8px}
.t{border:1px solid var(--line);border-radius:8px;padding:6px 8px;display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center;font-size:14px}
.t .em{font-size:26px}
.t .mk{font-size:18px;font-weight:800}
.t.good{background:var(--veg-soft)} .t.bad{background:var(--bad-soft)}
.t.good .mk{color:var(--ok)} .t.bad .mk{color:var(--bad)}
.acc{font-size:20px;font-weight:800;margin:8px 0 0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
/* result */
.result{max-width:640px;margin:20px auto}
.big{font-size:64px;font-weight:800;line-height:1}
table.res{width:100%;border-collapse:collapse;margin:10px 0}
table.res td{padding:6px 4px;border-bottom:1px solid var(--line)}
table.res td:last-child{text-align:right;font-family:"IBM Plex Mono",monospace;font-weight:600}
.confirm{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="kicker" data-i18n="kicker">Інформатика · практична робота · штучний інтелект</div>
      <h1 data-i18n="title">Навчи й перевір ШІ</h1>
    </div>
    <div class="hright">
      <div class="lang" role="group" aria-label="Мова / Language">
        <button type="button" data-lang="uk" aria-pressed="true">UA</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <div class="who" id="who" hidden></div>
    </div>
  </header>

  <!-- start -->
  <section class="card start" id="startBox" hidden>
    <h2 data-i18n="startH">Початок</h2>
    <label><span data-i18n="nameL">Твоє ім'я та прізвище</span><input type="text" id="nameIn" maxlength="40" autocomplete="off"></label>
    <label><span data-i18n="codeL2">Код від учителя або код продовження</span><input type="text" id="codeIn" maxlength="12" inputmode="numeric" autocomplete="off" style="width:150px;font-family:'IBM Plex Mono',monospace"></label>
    <div class="err" id="startErr"></div>
    <div><button class="btn" type="button" id="startGo" data-i18n="startGo">Почати</button></div>
    <p class="note" data-i18n="startNote"></p>
    <p class="note" data-i18n="resumeNote"></p>
  </section>

  <!-- work -->
  <div id="work" hidden>
    <div class="tabs" id="tabs" role="tablist"></div>
    <section class="card task" id="task" aria-live="polite"></section>

    <div class="scheme" id="schemeRow" hidden><span data-i18n="scheme">Хто розмічав дані:</span><span class="seg"><button type="button" data-sc="k" data-i18n="cook">Кухар</button><button type="button" data-sc="b" data-i18n="bot">Ботанік</button></span></div>
    <div class="grid" id="lab">
      <section class="card">
        <h2 data-i18n="poolH">Продукти для навчання</h2>
        <p class="note" style="margin:0 0 8px" data-i18n="poolNote">Натисни на продукт, щоб додати його в навчальні приклади або прибрати. Під назвою — те, що бачить машина.</p>
        <div class="pool" id="pool"></div>
      </section>
      <div style="display:grid;gap:16px">
        <section class="card">
          <h2><span data-i18n="trainH">Навчальні приклади</span> <span class="note" id="trainN"></span></h2>
          <div class="train" id="train"></div>
          <div class="row"><button class="btn ghost sm" type="button" id="clearBtn" data-i18n="clear">Прибрати все</button></div>
          <div class="rule" id="rule"></div>
        </section>
        <section class="card">
          <h2 data-i18n="testH">Перевірка</h2>
          <div class="row">
            <button class="btn" type="button" id="testBtn" data-i18n="testBtn">Перевірити на нових продуктах</button>
            <button class="btn ghost" type="button" id="trainTestBtn" data-i18n="trainTestBtn">Перевірити на навчальних</button>
          </div>
          <div id="testOut"></div>
        </section>
      </div>
    </div>
  </div>

  <!-- result -->
  <section class="card result" id="resultBox" hidden></section>

  <p class="note" style="margin-top:24px">
    <button class="btn ghost sm" type="button" id="other" data-i18n="other" hidden>Інший учень</button>
    <button class="btn ghost sm" type="button" id="restart" data-i18n="restart">Почати заново</button>
    <span class="confirm" id="ask" hidden><span data-i18n="restartQ">Усі бали зітруться. Точно?</span>
      <button class="btn no sm" type="button" id="askYes" data-i18n="yes">Так</button>
      <button class="btn ghost sm" type="button" id="askNo" data-i18n="no">Ні</button>
    </span>
  </p>
</div>

      {max:2,sc:'both',uk:{t:'Кухар проти ботаніка',x:['Збери набір із 6 і більше продуктів, на якому машина кухаря й машина ботаніка оберуть РІЗНІ ознаки.','Спершу подумай без перемикача, потім перевір себе перемикачем.','Запиши обидві ознаки. 1 бал за кожну правильну.']},en:{t:'Cook vs botanist',x:['Build a set of 6 or more products on which the cook’s machine and the botanist’s machine pick DIFFERENT features.','Think first without the switch, then check yourself with it.','Write down both features. 1 point for each correct one.']},
        qs:[featQ('k',{uk:'Машина кухаря обере ознаку:',en:'The cook’s machine will pick:'}),featQ('b',{uk:'Машина ботаніка обере ознаку:',en:'The botanist’s machine will pick:'})],
        check:function(){ if(st.train.length<6) return [0,[L('Потрібно щонайменше 6 продуктів.','At least 6 products are needed.')]]; var mk=learn(rowsAs('k')), mb=learn(rowsAs('b')), p=0, r=[]; if(!mk||!mb||mk.f===mb.f) return [0,[L('На цьому наборі обидві машини обирають ту саму ознаку. Потрібні різні.','On this set both machines pick the same feature. They must differ.')]]; var a=st.ans['9k'], b=st.ans['9b']; if(mk&&a!==undefined&&+a===mk.f) p++; else r.push(L('Кухар — не та ознака.','Cook — wrong feature.')); if(mb&&b!==undefined&&+b===mb.f) p++; else r.push(L('Ботанік — не та ознака.','Botanist — wrong feature.')); return [p,r]; }}
    ]
  };
  function sameRule(a,b){ var ka=Object.keys(a), kb=Object.keys(b); return ka.length===kb.length&&kb.every(function(k){ return a[k]===b[k]; }); }

  /* ---------- training set ---------- */
  function setTrain(list,flip,preset){ st.train=list.map(function(x){ return {id:x[0],l:x[1]}; }); st.flip=flip; st.preset=preset; st.test=null; st.ttest=null; save(); renderLab(); }
  function loadPred(key){ setScheme('k',true); setTrain(PRESET[key].set.map(function(id){ return [id,truth(id,'k')]; }),false,key); st.peek[st.task]=0; save(); }
  function setScheme(sc,quiet){ st.scheme=sc; st.flip=false; if(st.preset&&st.preset.indexOf('bad')===0) st.preset=null; st.train.forEach(function(e){ e.l=truth(e.id); }); st.test=null; st.ttest=null; save(); if(!quiet) renderAll(); }
  function toggle(id){
    var i=-1; st.train.forEach(function(e,k){ if(e.id===id) i=k; });
    if(i>=0) st.train.splice(i,1); else st.train.push({id:id,l:truth(id)});
    save(); renderLab();
  }
  function itemCard(id){ var it=IT[id]; return '<span class="em">'+it.e+'</span><span class="nm">'+esc(nm(id))+' <small>· '+esc(cls(truth(id)))+'</small></span><span class="ft">'+esc(it.f.map(fv).join(' · '))+'</span>'; }
  function renderLab(){
    var tk=TASKS[st.grade][st.task-1];
    $('schemeRow').hidden=tk.sc!=='both';
    Array.prototype.forEach.call(document.querySelectorAll('#schemeRow button'),function(b){ b.setAttribute('aria-pressed',b.getAttribute('data-sc')===st.scheme?'true':'false'); });
    $('pool').innerHTML=POOL.map(function(id){ var on=st.train.some(function(e){ return e.id===id; }); return '<button type="button" class="item '+SEM[st.scheme][truth(id)]+(on?' in':'')+'" data-id="'+id+'" aria-pressed="'+on+'">'+itemCard(id)+'</button>'; }).join('');
    Array.prototype.forEach.call(document.querySelectorAll('#pool .item'),function(b){ b.addEventListener('click',function(){ toggle(b.getAttribute('data-id')); }); });
    $('trainN').textContent=t('nItems')(st.train.length);
    $('train').innerHTML=(st.flip?'<p class="note" style="width:100%;margin:0 0 4px">'+esc(t('flipNote'))+'</p>':'')+st.train.map(function(e,k){ return '<span class="chip">'+IT[e.id].e+' '+esc(nm(e.id))+' <button type="button" class="lab '+SEM[st.scheme][e.l]+(st.flip?' flip':'')+'" data-k="'+k+'"'+(st.flip?'':' tabindex="-1"')+'>'+esc(cls(e.l))+'</button><button type="button" class="x" data-k="'+k+'" aria-label="×">×</button></span>'; }).join('');
    Array.prototype.forEach.call(document.querySelectorAll('#train .x'),function(b){ b.addEventListener('click',function(){ st.train.splice(+b.getAttribute('data-k'),1); save(); renderLab(); }); });
    Array.prototype.forEach.call(document.querySelectorAll('#train .lab.flip'),function(b){ b.addEventListener('click',function(){ var e=st.train[+b.getAttribute('data-k')]; e.l=(e.l+1)%3; save(); renderLab(); }); });
    var m=learn(rows());
    if(!m) $('rule').innerHTML=esc(t('ruleNone'));
    else{
      var li=Object.keys(m.rule).map(function(v){ return '<li>'+esc(t('ruleIf')(fv(v),cls(m.rule[v])))+'</li>'; }).join('');
      $('rule').innerHTML=t('ruleH')(esc(FV[lang].feat[m.f]),m.err)+'<ul>'+li+'</ul><div class="note" style="margin-top:4px">'+esc(t('ruleUnseen'))+'</div>';
    }
    renderTest();
  }
  function renderTest(){
    var h='';
    [['test',t('newH')],['ttest',t('trainTH')]].forEach(function(p){
      var r=st[p[0]]; if(!r||r.sig!==sig()) return;
      h+='<h3 style="margin-top:12px">'+esc(p[1])+'</h3><div class="tests">'+r.res.map(function(x){ return '<div class="t '+(x[2]?'good':'bad')+'"><span class="em">'+IT[x[0]].e+'</span><span>'+esc(nm(x[0]))+'<br><b>'+esc(cls(x[1]))+'</b>'+(x[2]?'':'<br><small>'+esc(t('need'))+': '+esc(cls(truth(x[0])))+'</small>')+'</span><span class="mk">'+(x[2]?'✓':'✗')+'</span></div>'; }).join('')+'</div><div class="acc">'+esc(t('accT')(r.c,r.n))+'</div>';
    });
    $('testOut').innerHTML=h;
  }
  $('testBtn').addEventListener('click',function(){
    var m=learn(rows()), r=evalOn(TEST,m); r.sig=sig(); st.test=r;
    var tk=TASKS[st.grade][st.task-1]; if(tk.pred&&st.preset===tk.pred) st.peek[st.task]=1;
    if(m&&st.scheme==='k'&&allTrue()) st.ach['f'+m.f]=1;
    save(); renderTest();
  });
  $('trainTestBtn').addEventListener('click',function(){ var m=learn(rows()), r=evalOn(st.train.map(function(e){ return e.id; }),m); r.sig=sig(); st.ttest=r; save(); renderTest(); });
  $('clearBtn').addEventListener('click',function(){ setTrain([],false,null); });
  Array.prototype.forEach.call(document.querySelectorAll('#schemeRow button'),function(b){ b.addEventListener('click',function(){ if(b.getAttribute('data-sc')!==st.scheme) setScheme(b.getAttribute('data-sc')); }); });

  /* ---------- task screen ---------- */
  /* main part: the first CORE tasks, each point counts double (6 points → 12). The rest are bonus ★: +1 per point, the mark is 12 at most. */
  var CORE={'3':4,'4':4,'5':5,'6':5};
  function isCore(n){ return n<=CORE[st.grade]; }
  function wt(n){ return isCore(n)?2:1; }
  function total(){ var s=0, T=TASKS[st.grade]; for(var n=1;n<=T.length;n++) s+=(st.pts[n]||0)*wt(n); return Math.min(12,s); }
  function bonusSum(){ var s=0,m=0,T=TASKS[st.grade]; for(var n=CORE[st.grade]+1;n<=T.length;n++){ s+=st.pts[n]||0; m+=T[n-1].max; } return [s,m]; }
  /* continue code: grade + points of every task, 7 digits with a check pair */
  var INV=17679;
  function encode(g,pts,nm){ var T=TASKS[g], idx=0, mul=1; for(var i=0;i<T.length;i++){ idx+=Math.min(pts[i+1]||0,T[i].max)*mul; mul*=T[i].max+1; }
    var N=(+g-3)*4000+idx, X=(N*7919+40427)%100000, C=(N*61+29+nhash(nm))%97, d=('0000'+X).slice(-5)+('0'+C).slice(-2);
    return d.slice(0,3)+'-'+d.slice(3,5)+'-'+d.slice(5); }
  function decode(c,nm){ if(!/^\d{7}$/.test(c)) return null; var X=+c.slice(0,5), C=+c.slice(5), N=((X-40427+100000)%100000)*INV%100000;
    if(N>=16000||(N*61+29+nhash(nm))%97!==C) return null; var g=String(Math.floor(N/4000)+3), idx=N%4000, T=TASKS[g], pts={};
    for(var i=0;i<T.length;i++){ var r=T[i].max+1; pts[i+1]=idx%r; idx=Math.floor(idx/r); } if(idx) return null; return {g:g,pts:pts}; }
  function openTask(n){
    st.task=n; st.view='work';
    var tk=TASKS[st.grade][n-1];
    if(tk.sc==='k'&&st.scheme!=='k') setScheme('k',true);
    if(st.flip&&!tk.bad){ st.flip=false; st.preset=null; st.train.forEach(function(e){ e.l=truth(e.id); }); st.test=null; }
    save(); renderAll();
  }
  function renderTabs(){
    var T=TASKS[st.grade];
    $('tabs').innerHTML=T.map(function(tk,i){ var n=i+1, p=st.pts[n]||0, w=wt(n); return (n===CORE[st.grade]+1?'<span class="tabsep">'+esc(t('bonusSep'))+'</span>':'')+'<button type="button" role="tab" class="tab'+(p>=tk.max?' full':'')+(isCore(n)?'':' bonus')+'" data-n="'+n+'" aria-selected="'+(st.task===n)+'">'+n+'. '+esc(tk[lang].t)+' <span class="pt">'+(isCore(n)?p*w+'/'+tk.max*w:'+'+p+'★')+'</span></button>'; }).join('')+'<button type="button" role="tab" class="tab" data-n="r">'+esc(t('result'))+' <span class="pt">'+total()+'/12</span></button>';
    Array.prototype.forEach.call(document.querySelectorAll('#tabs .tab'),function(b){ b.addEventListener('click',function(){ var n=b.getAttribute('data-n'); if(n==='r') showResult(); else openTask(+n); }); });
  }
  function renderTask(){
    var tk=TASKS[st.grade][st.task-1], L2=tk[lang], n=st.task, h='';
    h+='<h2>'+esc(t('task'))+' '+n+' · '+esc(L2.t)+' <span class="note">('+(isCore(n)?tk.max*2+' '+esc(t('ptsGrade')):esc(t('bonusTag'))+', +'+tk.max)+')</span></h2><ol>'+L2.x.map(function(x){ return '<li>'+esc(x)+'</li>'; }).join('')+'</ol>';
    if(tk.btn) h+='<div class="row" style="margin-bottom:8px"><button class="btn ghost" type="button" id="tBtn">'+esc(tk.btn[lang])+'</button></div>';
    (tk.qs||[]).forEach(function(qq){
      if(qq.type==='pred'){
        PRESET[qq.key].items.forEach(function(id,i){ var key=n+'p'+i, a=st.ans[key];
          h+='<div class="q"><p>'+IT[id].e+' '+esc(nm(id))+' <span class="note">('+esc(IT[id].f.map(fv).join(' · '))+')</span></p><div class="opts">'+[0,1,2,3].map(function(c){ return '<label><input type="radio" name="'+key+'" value="'+c+'"'+(a!==undefined&&+a===c?' checked':'')+'> '+esc(c===3?t('unknown'):CL[lang].k[c])+'</label>'; }).join('')+'</div></div>'; });
        return;
      }
      var key=n+qq.id, a=st.ans[key];
      if(qq.type==='num') h+='<div class="q"><p>'+esc(qq.text[lang])+'</p><input type="text" inputmode="numeric" maxlength="2" data-key="'+key+'" value="'+(a!==undefined?esc(String(a)):'')+'"></div>';
      else h+='<div class="q"><p>'+esc(qq.text[lang])+'</p><div class="opts">'+qq.opts.map(function(o,i){ return '<label><input type="radio" name="'+key+'" value="'+i+'"'+(a!==undefined&&+a===i?' checked':'')+'> <span>'+esc(o[lang])+'</span></label>'; }).join('')+'</div></div>';
    });
    h+='<div class="row"><button class="btn" type="button" id="chk">'+esc(t('check'))+'</button>'+(n<TASKS[st.grade].length?'<button class="btn ghost" type="button" id="nxt">'+esc(t('next'))+'</button>':'')+(n>=CORE[st.grade]?'<button class="btn ghost" type="button" id="fin">'+esc(t('finish'))+'</button>':'')+'</div><div class="feedback" id="fb"></div>';
    $('task').innerHTML=h;
    if(tk.btn) $('tBtn').addEventListener('click',function(){ tk.btn.run(); });
    Array.prototype.forEach.call(document.querySelectorAll('#task input[type=text]'),function(i){ i.addEventListener('input',function(){ st.ans[i.getAttribute('data-key')]=i.value.replace(/\D/g,''); save(); }); });
    Array.prototype.forEach.call(document.querySelectorAll('#task input[type=radio]'),function(i){ i.addEventListener('change',function(){ st.ans[i.name]=+i.value; save(); }); });
    $('chk').addEventListener('click',function(){
      var res=tk.check(), p=res[0];
      if(p>(st.pts[n]||0)) st.pts[n]=p;   /* the best attempt counts */
      save(); renderTabs(); renderWho();
      var fb=$('fb');
      if(p>=tk.max){ fb.className='feedback ok'; fb.textContent=t('fbOk'); }
      else { fb.className='feedback part'; fb.innerHTML=esc(p>0?t('fbPart')+p*wt(n)+'/'+tk.max*wt(n):t('fbNone'))+(res[1].length?'<ul>'+res[1].map(function(x){ return '<li>'+esc(x)+'</li>'; }).join('')+'</ul>':''); }
    });
    if($('fin')) $('fin').addEventListener('click',showResult);
    if($('nxt')) $('nxt').addEventListener('click',function(){ openTask(n+1); window.scrollTo(0,0); });
  }
  function showResult(){ if(!st.end) st.end=Date.now(); st.view='result'; save(); renderAll(); }
  function renderResult(){
    var T=TASKS[st.grade], mins=Math.max(1,Math.round((st.act||0)/60000)), bs=bonusSum();
    var h='<h2>'+esc(t('resH'))+'</h2><p style="font-size:20px;margin:4px 0"><b>'+esc(st.name)+'</b> · '+esc(t('grade')(st.grade))+'</p><div class="big">'+total()+' <span style="font-size:28px;color:var(--muted)">'+esc(t('of'))+' 12</span></div><p class="note" style="margin:0 0 8px">'+esc(t('resRule'))+'</p>';
    h+='<table class="res">'+T.map(function(tk,i){ var n=i+1, p=st.pts[n]||0; return (n===CORE[st.grade]+1?'<tr><td colspan="2"><b>'+esc(t('resBonus'))+': +'+bs[0]+' '+esc(t('of'))+' '+bs[1]+'</b></td></tr>':'')+'<tr><td>'+n+'. '+esc(tk[lang].t)+'</td><td>'+(isCore(n)?p*2+' / '+tk.max*2:'+'+p+' / '+tk.max+' ★')+'</td></tr>'; }).join('')+'<tr><td>'+esc(t('resTime2'))+'</td><td>'+mins+esc(t('resMin'))+(st.coded?' +':'')+'</td></tr><tr><td>'+esc(t('resCode'))+'</td><td class="rcode">'+encode(st.grade,st.pts,st.name)+'</td></tr></table>';
    h+='<p class="note">'+esc(t('resShow'))+'</p><button class="btn ghost" type="button" id="back">'+esc(t('resBack'))+'</button>';
    $('resultBox').innerHTML=h;
    $('back').addEventListener('click',function(){ st.view='work'; st.end=0; save(); renderAll(); });
  }

  /* ---------- start ---------- */
  var CODES={'31':'3','41':'4','51':'5','61':'6'};
  $('startGo').addEventListener('click',go);
  $('codeIn').addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); go(); } });
  function go(){
    var n=$('nameIn').value.trim(), c=$('codeIn').value.replace(/\D/g,'');
    if(n.length<2){ $('startErr').textContent=t('errName'); return; }
    var msg='';
    if(CODES[c]){
      var id=pid(CODES[c],n);
      if(DB.p[id]){ st=DB.p[id]; st.view='work'; st.end=0; msg=t('resumed'); }
      else { st=fresh(); st.name=n; st.grade=CODES[c]; st.start=Date.now(); }
    } else {
      var d=decode(c,n); if(!d){ $('startErr').textContent=t('errCode2'); return; }
      var id2=pid(d.g,n), base=DB.p[id2];
      if(!base){ base=fresh(); base.name=n; base.grade=d.g; base.start=Date.now(); }
      Object.keys(d.pts).forEach(function(k){ if(d.pts[k]>(base.pts[k]||0)) base.pts[k]=d.pts[k]; });
      base.coded=1; base.view='work'; base.end=0; st=base; msg=t('codeWarn');
    }
    st.last=Date.now(); $('startErr').textContent=''; save(); renderAll();
    if(msg){ var fb=$('fb'); if(fb){ fb.className='feedback ok'; fb.textContent=msg; } }
  }
  $('restart').addEventListener('click',function(){ $('ask').hidden=false; });
  $('askNo').addEventListener('click',function(){ $('ask').hidden=true; });
  $('askYes').addEventListener('click',function(){ if(DB.cur) delete DB.p[DB.cur]; st=fresh(); save(); $('ask').hidden=true; $('nameIn').value=''; $('codeIn').value=''; renderAll(); });
  $('other').addEventListener('click',function(){ save(); st=fresh(); save(); $('ask').hidden=true; $('nameIn').value=''; $('codeIn').value=''; renderAll(); });

  function renderWho(){ var started=!!st.grade; $('who').hidden=!started; if(started) $('who').innerHTML=esc(st.name)+' · '+esc(t('grade')(st.grade))+'<br><b>'+total()+'</b> / 12<small>'+esc(t('codeTop'))+': <span>'+encode(st.grade,st.pts,st.name)+'</span></small>'; }
  function renderAll(){
    var started=!!st.grade;
    $('startBox').hidden=started; $('work').hidden=!started||st.view==='result'; $('resultBox').hidden=!started||st.view!=='result'; $('restart').hidden=!started; $('other').hidden=!started;
    renderWho();
    if(!started) return;
    if(st.view==='result'){ renderResult(); return; }
    renderTabs(); renderTask(); renderLab();
  }
  function applyLang(){
    document.documentElement.lang=lang; document.title=t('doc');
    Array.prototype.forEach.call(document.querySelectorAll('[data-i18n]'),function(el){ el.textContent=t(el.getAttribute('data-i18n')); });
    Array.prototype.forEach.call(document.querySelectorAll('.lang button'),function(b){ b.setAttribute('aria-pressed',b.getAttribute('data-lang')===lang?'true':'false'); });
    $('startErr').textContent='';
    renderAll();
  }
  Array.prototype.forEach.call(document.querySelectorAll('.lang button'),function(b){ b.addEventListener('click',function(){ var nl=b.getAttribute('data-lang'); if(nl===lang) return; lang=nl; try{ localStorage.setItem(LANGKEY,lang); }catch(e){} applyLang(); }); });
  applyLang();
})();
</script>
</body>
