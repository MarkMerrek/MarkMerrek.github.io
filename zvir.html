<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Вгадай звіра</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* A machine that plays "guess the animal" with yes/no questions and learns a new question every time it loses (a decision tree that grows). */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#E9EDF3;
  --ink:#151A22; --ink-2:#3C4656; --muted:#687386;
  --line:#D8DFE8; --line-strong:#BEC8D6;
  --accent:#2E4A7D; --on-accent:#FFFFFF; --accent-soft:#E2E9F5;
  --yes:#1E6B3A; --yes-soft:#E1F1E6; --no:#8C2F2F; --no-soft:#F6E3E3;
  --warm:#8A570F; --warm-soft:#F5E9D7;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#10131A; --surface:#181C25; --surface-2:#222836;
    --ink:#E9EDF4; --ink-2:#C2CAD8; --muted:#8C96A9;
    --line:#2A3140; --line-strong:#3A4354;
    --accent:#93B4E8; --on-accent:#10131A; --accent-soft:#1C2637;
    --yes:#7FD39A; --yes-soft:#18291F; --no:#E89494; --no-soft:#2E1C1C;
    --warm:#DCA76A; --warm-soft:#2C2318;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Archivo",Arial,sans-serif;font-size:17px;line-height:1.45}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px 60px}
header{padding:24px 0 12px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px}
.kicker{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{font-weight:800;font-size:clamp(28px,4.6vw,42px);line-height:1.05;margin:4px 0 0;letter-spacing:-.02em}
.score{font-family:"IBM Plex Mono",monospace;font-size:15px;color:var(--ink-2);text-align:right}
.score b{font-family:"Archivo",Arial,sans-serif;font-size:26px;color:var(--ink)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,380px);gap:20px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.btn{appearance:none;font-family:"Archivo",Arial,sans-serif;font-weight:700;font-size:17px;padding:11px 18px;border-radius:8px;border:2px solid var(--accent);background:var(--accent);color:var(--on-accent);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line-strong)}
.btn.yes{background:var(--yes);border-color:var(--yes);color:var(--on-accent);font-size:22px;padding:14px 34px}
.btn.no{background:var(--no);border-color:var(--no);color:var(--on-accent);font-size:22px;padding:14px 34px}
.btn:focus-visible,input:focus-visible,.chip:focus-visible,.pick:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:16px}
.play{min-height:330px;display:flex;flex-direction:column;justify-content:center;text-align:center}
.say{font-size:clamp(24px,3.4vw,34px);font-weight:800;line-height:1.2;margin:6px 0}
.sub{color:var(--muted);font-size:16px;margin:6px 0 0}
.big{font-size:64px;line-height:1}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;margin-top:14px;text-align:center}
.pick{appearance:none;border:1px solid var(--line-strong);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 4px;cursor:pointer;font:inherit;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:2px}
.pick span{font-size:28px;line-height:1.1}
.pick:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:14px}
.chip{appearance:none;border:1px solid var(--line-strong);background:var(--bg);color:var(--ink);border-radius:999px;padding:7px 13px;cursor:pointer;font:inherit;font-size:15px}
.chip:hover{border-color:var(--accent)}
.own{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin-top:14px}
.own input{font:inherit;font-size:17px;padding:8px 10px;border:1px solid var(--line-strong);border-radius:6px;background:var(--bg);color:var(--ink);width:min(320px,100%)}
.err{color:var(--no);font-size:15px;min-height:20px;margin-top:6px}
.brain h2{font-size:20px;margin:0 0 4px}
.brain .meta{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--muted);margin-bottom:10px}
ul.tree,ul.tree ul{list-style:none;margin:0;padding:0}
ul.tree ul{margin-left:14px;padding-left:12px;border-left:2px solid var(--line)}
ul.tree li{margin:5px 0}
.q{font-weight:700}
.tag{font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;border-radius:3px;padding:1px 6px;margin-right:6px}
.tag.y{background:var(--yes-soft);color:var(--yes)}
.tag.n{background:var(--no-soft);color:var(--no)}
.leaf{background:var(--surface-2);border-radius:5px;padding:1px 7px}
.hot>.q,.hot>.leaf{outline:2px solid var(--warm);outline-offset:2px;border-radius:4px}
.bottom{margin-top:16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.confirm .btn{padding:8px 14px;font-size:15px}
/* mission card */
.mission{background:var(--surface);border:2px solid var(--line-strong);border-radius:10px;padding:10px 14px;margin-bottom:14px}
.mission.up{border-color:var(--no);background:var(--no-soft)}
.m-code{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-weight:600}
.m-code input{font-family:"IBM Plex Mono",monospace;font-size:20px;font-weight:600;width:72px;padding:6px 8px;border:2px solid var(--line-strong);border-radius:6px;background:var(--bg);color:var(--ink);text-align:center}
.m-code .btn{padding:7px 14px;font-size:15px}
.m-err{color:var(--no);font-size:14.5px}
.m-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.m-no{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.m-time{font-family:"IBM Plex Mono",monospace;font-size:30px;font-weight:600}
.mission.up .m-time{color:var(--no)}
.m-title{font-size:21px;font-weight:800;margin:2px 0 6px}
.m-list{margin:0 0 8px;padding-left:22px}
.m-list li{margin:3px 0}
.m-up{font-weight:700;color:var(--no);margin:6px 0}
.m-sec{background:var(--accent-soft);border-left:4px solid var(--accent);border-radius:6px;padding:8px 12px;margin:8px 0}
.m-foot{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-top:8px}
.m-foot .m-code{font-weight:500;font-size:15px;color:var(--ink-2)}
.m-foot .m-code input{font-size:16px;width:60px;padding:4px 6px}
.m-foot .btn.ghost{font-size:15px;padding:8px 14px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="kicker">Інформатика · штучний інтелект</div>
      <h1>Вгадай звіра</h1>
    </div>
    <div class="score">вгадала <b id="wins">0</b> з <b id="games">0</b><br>знає тварин: <b id="known">1</b></div>
  </header>

  <div class="grid">
    <div>
      <div class="card play" id="play" aria-live="polite"></div>
      <div class="bottom">
        <button class="btn ghost" type="button" id="brainBtn">Показати мізки машини</button>
        <button class="btn ghost" type="button" id="newBtn">Нова машина</button>
        <span class="confirm" id="ask" hidden><span id="askText"></span>
          <button class="btn no" type="button" id="askYes">Так</button>
          <button class="btn ghost" type="button" id="askNo">Ні</button>
        </span>
      </div>
    </div>
    <div>
      <section class="mission" id="mission" aria-live="polite"></section>
    <aside class="card brain" id="brain" hidden>
      <h2>Мізки машини</h2>
      <div class="meta" id="brainMeta"></div>
      <ul class="tree" id="tree"></ul>
    </aside>
    </div>
  </div>
</div>

<script>
(function(){
  var KEY='zvir-v1', MKEY='zvir-mission', TTL=3*3600*1000;
  var ANIMALS=[['Кіт','🐱'],['Собака','🐶'],['Миша','🐭'],['Заєць','🐰'],['Їжак','🦔'],['Білка','🐿️'],['Лисиця','🦊'],['Вовк','🐺'],['Ведмідь','🐻'],['Лев','🦁'],['Тигр','🐯'],['Слон','🐘'],['Жираф','🦒'],['Зебра','🦓'],['Мавпа','🐒'],['Корова','🐮'],['Кінь','🐴'],['Свиня','🐷'],['Вівця','🐑'],['Курка','🐔'],['Качка','🦆'],['Сова','🦉'],['Орел','🦅'],['Пінгвін','🐧'],['Горобець','🐦'],['Риба','🐟'],['Акула','🦈'],['Дельфін','🐬'],['Кит','🐳'],['Восьминіг','🐙'],['Черепаха','🐢'],['Жаба','🐸'],['Змія','🐍'],['Крокодил','🐊'],['Метелик','🦋'],['Бджола','🐝'],['Павук','🕷️'],['Равлик','🐌'],['Динозавр','🦖'],['Єдиноріг','🦄']];
  var EMO={}; ANIMALS.forEach(function(a){ EMO[a[0].toLowerCase()]=a[1]; });
  var QUESTIONS=['Вона вміє літати?','Вона живе у воді?','У неї є шерсть?','У неї є пір\'я?','У неї є лапи?','У неї більше ніж 4 лапи?','Вона більша за людину?','Вона менша за кота?','Вона живе вдома або на фермі?','Вона живе в лісі?','Вона живе в Африці?','Вона їсть м\'ясо?','Вона небезпечна для людини?','У неї є смужки або плями?','У неї є панцир?','У неї довга шия?','У неї є хобот, роги або бивні?','Вона несе яйця?','Вона справжня, а не вигадана?'];
  function emo(name){ return EMO[name.toLowerCase()]||'🐾'; }
  function leaf(a){ return {a:a}; }
  function fresh(){ return {tree:leaf('Кіт'), wins:0, games:0}; }
  var st=fresh();
  try{ var raw=JSON.parse(localStorage.getItem(KEY)||'null'); if(raw&&raw.tree) st=raw; }catch(e){}
  function save(){ try{ localStorage.setItem(KEY,JSON.stringify(st)); }catch(e){} }
  var $=function(id){ return document.getElementById(id); };
  function esc(x){ var d=document.createElement('div'); d.textContent=x; return d.innerHTML; }
  function count(n){ return n.a!=null?1:count(n.yes)+count(n.no); }
  function depth(n){ return n.a!=null?0:1+Math.max(depth(n.yes),depth(n.no)); }

  /* game state */
  var cur=null, path=[], parent=null, side=null, newAnimal='', newQ='';
  function stats(){ $('wins').textContent=st.wins; $('games').textContent=st.games; $('known').textContent=count(st.tree); }
  function show(h){ $('play').innerHTML=h; }

  function start(){
    show('<div class="big">🤔</div><div class="say">Задумай тварину</div><p class="sub">Нікому не кажи. Я спробую вгадати, питаючи «так» чи «ні».</p><div class="row"><button class="btn" type="button" id="go">Грати</button></div>');
    $('go').addEventListener('click',function(){ cur=st.tree; path=[cur]; parent=null; side=null; step(); });
    renderBrain();
  }
  function yn(onYes,onNo){
    $('y').addEventListener('click',onYes); $('n').addEventListener('click',onNo);
  }
  function step(){
    renderBrain();
    if(cur.a!=null){
      show('<div class="big">'+emo(cur.a)+'</div><div class="say">Це — '+esc(cur.a)+'?</div><div class="row"><button class="btn yes" type="button" id="y">Так</button><button class="btn no" type="button" id="n">Ні</button></div>');
      yn(function(){ st.wins++; st.games++; save(); stats(); show('<div class="big">🎉</div><div class="say">Вгадала!</div><p class="sub">Я знаю вже '+count(st.tree)+' '+plural(count(st.tree))+'.</p><div class="row"><button class="btn" type="button" id="again">Ще раз</button></div>'); $('again').addEventListener('click',start); },
         function(){ st.games++; save(); stats(); askAnimal(); });
      return;
    }
    show('<div class="big">❓</div><div class="say">'+esc(cur.q)+'</div><div class="row"><button class="btn yes" type="button" id="y">Так</button><button class="btn no" type="button" id="n">Ні</button></div>');
    yn(function(){ go('yes'); }, function(){ go('no'); });
  }
  function go(s){ parent=cur; side=s; cur=cur[s]; path.push(cur); step(); }
  function plural(n){ var m10=n%10, m100=n%100; if(m10===1&&m100!==11) return 'тварину'; if(m10>=2&&m10<=4&&(m100<12||m100>14)) return 'тварини'; return 'тварин'; }

  function findLeaf(n,name){ if(n.a!=null) return n.a.toLowerCase()===name.toLowerCase(); return findLeaf(n.yes,name)||findLeaf(n.no,name); }
  function askAnimal(){
    var h='<div class="say">Здаюся! Яка це тварина?</div><p class="sub">Обери або напиши свою.</p><div class="picks">';
    ANIMALS.forEach(function(a,i){ h+='<button class="pick" type="button" data-i="'+i+'"><span>'+a[1]+'</span>'+esc(a[0])+'</button>'; });
    h+='</div><div class="own"><input id="ownA" type="text" maxlength="24" placeholder="Інша тварина…" autocomplete="off"><button class="btn" type="button" id="ownGo">Далі</button></div><div class="err" id="err"></div>';
    show(h);
    Array.prototype.forEach.call(document.querySelectorAll('.pick'),function(b){ b.addEventListener('click',function(){ gotAnimal(ANIMALS[+b.getAttribute('data-i')][0]); }); });
    var f=function(){ var v=$('ownA').value.trim(); if(!v){ $('err').textContent='Напиши назву тварини.'; return; } gotAnimal(v.charAt(0).toUpperCase()+v.slice(1)); };
    $('ownGo').addEventListener('click',f); $('ownA').addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); f(); } });
  }
  function gotAnimal(name){
    if(name.toLowerCase()===cur.a.toLowerCase()){ $('err').textContent='Але ж я так і сказала — '+cur.a+'! Обери іншу.'; return; }
    newAnimal=name;
    var used={}; path.forEach(function(n){ if(n.q) used[n.q]=1; });
    var note=findLeaf(st.tree,name)?'<p class="sub">Цікаво: я вже знаю «'+esc(name)+'», але в іншому місці мізків. Мабуть, цього разу відповідь на якесь питання була інша, ніж тоді, коли мене вчили.</p>':'';
    var h='<div class="say">Яке питання відрізняє '+emo(name)+' «'+esc(name)+'» від '+emo(cur.a)+' «'+esc(cur.a)+'»?</div>'+note+'<div class="chips">';
    QUESTIONS.forEach(function(q,i){ if(!used[q]) h+='<button class="chip" type="button" data-i="'+i+'">'+esc(q)+'</button>'; });
    h+='</div><div class="own"><input id="ownQ" type="text" maxlength="60" placeholder="Своє питання…" autocomplete="off"><button class="btn" type="button" id="ownGo">Далі</button></div><div class="err" id="err"></div>';
    show(h);
    Array.prototype.forEach.call(document.querySelectorAll('.chip'),function(b){ b.addEventListener('click',function(){ gotQ(QUESTIONS[+b.getAttribute('data-i')]); }); });
    var f=function(){ var v=$('ownQ').value.trim(); if(v.length<4){ $('err').textContent='Напиши питання, на яке можна відповісти «так» чи «ні».'; return; } if(!/\?$/.test(v)) v+='?'; gotQ(v.charAt(0).toUpperCase()+v.slice(1)); };
    $('ownGo').addEventListener('click',f); $('ownQ').addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); f(); } });
  }
  function gotQ(q){
    newQ=q;
    show('<div class="say">'+esc(q)+'</div><p class="sub">Яка відповідь для '+emo(newAnimal)+' «'+esc(newAnimal)+'»?</p><div class="row"><button class="btn yes" type="button" id="y">Так</button><button class="btn no" type="button" id="n">Ні</button></div>');
    yn(function(){ learn(true); }, function(){ learn(false); });
  }
  function learn(yesForNew){
    var old=leaf(cur.a), nw=leaf(newAnimal);
    delete cur.a; cur.q=newQ; cur.yes=yesForNew?nw:old; cur.no=yesForNew?old:nw;
    save(); stats();
    var n=count(st.tree);
    show('<div class="big">🧠</div><div class="say">Запам\'ятала!</div><p class="sub">Тепер я знаю '+n+' '+plural(n)+'. Наступного разу спитаю: «'+esc(newQ)+'»</p><div class="row"><button class="btn" type="button" id="again">Ще раз</button></div>');
    path=[]; renderBrain(cur);
    $('again').addEventListener('click',start);
  }

  /* brain */
  var brainOpen=false;
  function nodeHTML(n,hot){
    var cls=(hot&&hot.indexOf(n)>=0)?' class="hot"':'';
    if(n.a!=null) return '<li'+cls+'><span class="leaf">'+emo(n.a)+' '+esc(n.a)+'</span></li>';
    return '<li'+cls+'><span class="q">'+esc(n.q)+'</span><ul>'+
      branch('y','Так',n.yes,hot)+branch('n','Ні',n.no,hot)+'</ul></li>';
  }
  function branch(c,label,n,hot){
    var inner=nodeHTML(n,hot); /* put the tag in front of the child's own content */
    return inner.replace(/^<li( class="hot")?>/,function(m){ return m+'<span class="tag '+c+'">'+label+'</span>'; });
  }
  function renderBrain(hl){
    if(!brainOpen) return;
    var hot=hl?[hl]:path;
    $('tree').innerHTML=nodeHTML(st.tree,hot);
    var n=count(st.tree), d=depth(st.tree);
    $('brainMeta').textContent='тварин: '+n+' · питань: '+(n-1)+' · найдовший шлях: '+d+' '+(d%10===1&&d%100!==11?'питання':(d%10>=2&&d%10<=4&&(d%100<12||d%100>14)?'питання':'питань'));
  }
  $('brainBtn').addEventListener('click',function(){ brainOpen=!brainOpen; $('brain').hidden=!brainOpen; $('brainBtn').textContent=brainOpen?'Сховати мізки машини':'Показати мізки машини'; renderBrain(); });

  /* reset */
  var askMode='';
  $('newBtn').addEventListener('click',function(){ askMode='new'; $('askText').textContent='Машина забуде всіх тварин, крім кота, і рахунок. Точно?'; $('ask').hidden=false; });
  $('askNo').addEventListener('click',function(){ $('ask').hidden=true; });
  $('askYes').addEventListener('click',function(){ st=fresh(); save(); stats(); $('ask').hidden=true; start(); });

  /* missions: the teacher says a code aloud, it opens the task and starts the timer */
  var MIS={
    '53':{n:1,min:6,t:'Навчи з нуля',x:['Машина знає лише кота. Навчи її 8 тварин — якнайшвидше.','Щоразу задумуй нову тварину. Машина здалася — обери тварину й питання.','Добре питання ділить тварин навпіл: «Вона вміє літати?» краще за «Вона рожева?».'],end:'Скільки тварин знає твоя машина? Число вгорі праворуч.',s:['12 тварин. Хто перший?','Зроби так, щоб машина вгадала 5 ігор поспіль — щоразу іншу тварину.']},
    '66':{n:2,min:4,t:'Мізки машини',x:['Натисни «Показати мізки машини».','Знайди свою улюблену тварину. Скільки питань машина ставить, щоб до неї дійти?','Яке питання машина ставить першим? Хто його придумав?'],end:'Яке питання стоїть першим у твоїй машині?',s:['Знайди тварину, до якої найдовший шлях. Скільки там питань?','Знайди в мізках невдале питання: на «так» там одна тварина, а на «ні» — майже всі. Яким питанням його краще було б замінити?']},
    '79':{n:3,min:6,t:'Вгадай у гостях',x:['Пересядь за сусідній комп\'ютер.','Задумуй тварин і грай з чужою машиною. Здалася — навчи її.','Лічильник «вгадала X з Y» — оцінка тому, хто її вчив.'],end:'Повертайся на своє місце. Чия машина вгадувала найкраще?',s:['Знайди тварину, яку ця машина плутає з іншою. Чому так вийшло?','Знайди тварину, яку знає твоя машина, але не знає сусідська. Навчи сусідську — скільки питань довелося додати?']},
    '87':{n:4,min:5,t:'Хитрий учитель',x:['Натисни «Нова машина» — вона знову знає лише кота.','Навчи її 5 тварин. Але одного разу відповідай НЕПРАВИЛЬНО: наприклад, скажи, що риба вміє літати.','Попроси сусіда зіграти з твоєю машиною на рибу. Вгадає?'],end:'Хто винен, що машина помиляється: вона чи той, хто її вчив?',s:['Подивись у «Мізки машини»: де сидить твоя помилка? Як її виправити, не стираючи все?','Скільки інших тварин зачепила твоя брехня? Знайди їх у мізках: хто тепер «вміє літати», хоча не повинен?']},
    '92':{n:5,min:6,t:'Найкоротші мізки',x:['Натисни «Нова машина».','Навчи її 8 тварин так, щоб до кожної було не більше 3 питань. Перевір «найдовший шлях» у мізках.','Підказка: кожне питання має ділити тварин навпіл.'],end:'У кого вийшло 8 тварин за 3 питання?',s:['16 тварин — і не більше 4 питань до кожної.','Чому 8 тварин неможливо вмістити у 2 питання? Поясни сусідові на пальцях.']},
    '48':{n:6,min:6,t:'Водяні двійники',x:['Натисни «Нова машина».','Навчи її розрізняти 6 водяних тварин: риба, акула, дельфін, кит, восьминіг, черепаха.','Що менше питань знадобиться, то краще. Порахуй їх у мізках.'],end:'Яке питання найкраще розділило водяних тварин?',s:['Додай жабу й пінгвіна. Вони живуть у воді чи ні? Як вирішила твоя машина — і чи погодиться з нею сусід?','Пересядь до сусіда: чи вгадує його машина всіх шістьох з першого разу?']}
  };
  var mis=null, tick=null;
  try{ var mr=JSON.parse(localStorage.getItem(MKEY)||'null'); if(mr&&MIS[mr.code]&&Date.now()-mr.start<TTL) mis=mr; }catch(e){}
  function saveMis(){ try{ if(mis) localStorage.setItem(MKEY,JSON.stringify(mis)); else localStorage.removeItem(MKEY); }catch(e){} }
  function codeForm(label,id){ return '<div class="m-code"><label for="'+id+'">'+label+'</label><input id="'+id+'" type="text" inputmode="numeric" maxlength="2" autocomplete="off"><button class="btn" type="button" data-go="'+id+'">OK</button><span class="m-err" id="'+id+'Err"></span></div>'; }
  function fmt(ms){ var s=Math.max(0,Math.ceil(ms/1000)); return Math.floor(s/60)+':'+('0'+s%60).slice(-2); }
  function renderMission(){
    var box=$('mission'); clearInterval(tick);
    if(!mis){ box.className='mission'; box.innerHTML=codeForm('Код місії від учителя:','mc'); wire('mc'); return; }
    var m=MIS[mis.code], h='';
    h+='<div class="m-head"><span class="m-no">Місія '+m.n+' з 6</span><span class="m-time" id="mTime"></span></div>';
    h+='<div class="m-title">'+esc(m.t)+'</div><ul class="m-list">'+m.x.map(function(x){ return '<li>'+esc(x)+'</li>'; }).join('')+'</ul>';
    h+='<div class="m-up" id="mUp" hidden>Час! Руки від мишки — дивись на вчителя. '+esc(m.end)+'</div>';
    var SS=[].concat(m.s||[]), got=Math.min(+mis.sec||0,SS.length);
    for(var si=0;si<got;si++) h+='<div class="m-sec"><b>'+(si===0?'Секретне завдання.':'Рівень '+(si+1)+'.')+'</b> '+esc(SS[si])+'</div>';
    h+='<div class="m-foot">'+(got<SS.length?'<button class="btn ghost" type="button" id="mDone">'+(got===0?'Готово! Дай секретне завдання':'Готово! Ще складніше')+'</button>':'<span></span>')+codeForm('Код наступної місії:','mn')+'</div>';
    box.innerHTML=h; wire('mn');
    if($('mDone')) $('mDone').addEventListener('click',function(){ mis.sec=(+mis.sec||0)+1; saveMis(); renderMission(); });
    var upd=function(){ var l=m.min*60000-(Date.now()-mis.start); $('mTime').textContent=fmt(l); var up=l<=0; box.className='mission'+(up?' up':''); $('mUp').hidden=!up; if(up) clearInterval(tick); };
    upd(); tick=setInterval(upd,1000);
  }
  function wire(id){
    var inp=$(id), go=function(){
      var c=inp.value.replace(/\D/g,'');
      if(!MIS[c]){ $(id+'Err').textContent='Такого коду немає. Перепитай учителя.'; inp.select(); return; }
      if(mis&&mis.code===c){ inp.value=''; return; }
      if(c==='53'){ st=fresh(); save(); stats(); start(); } /* first mission starts from a clean machine for every new class */
      mis={code:c,start:Date.now(),sec:false}; saveMis(); renderMission();
    };
    inp.addEventListener('keydown',function(e){ if(e.key==='Enter') go(); });
    inp.addEventListener('input',function(){ $(id+'Err').textContent=''; });
    document.querySelector('[data-go="'+id+'"]').addEventListener('click',go);
  }

  stats(); renderMission(); start();
})();
</script>
</body>
</html>
